syntax = "proto3";

import "common.proto";

package hegadb.protocol;

message EncryptedParameter {
  uint32 index = 1;
  bytes ciphertext = 2;
}

message ColumnRef {
  string table = 1;
  string column = 2;
}

message ParameterRef {
  uint32 parameter_index = 1;
}

message Wildcard {}

enum ComparisonOp {
  EQ = 0;
  NEQ = 1;
  LT = 2;
  GT = 3;
  LTE = 4;
  GTE = 5;
}

message ComparisonExpr {
  Expression left = 1;
  ComparisonOp operator = 2;
  Expression right = 3;
}

enum LogicalOp {
  AND = 0;
  OR = 1;
}

message LogicalExpr {
  Expression left = 1;
  LogicalOp operator = 2;
  Expression right = 3;
}

message NotExpr {
  Expression child = 1;
}

message Expression {
  // Variant type that can be one of these types
  oneof expr_type {
    ColumnRef column_ref = 1;
    ParameterRef parameter_ref = 2;
    Wildcard wildcard = 3;
    LogicalExpr logical_expr = 4;
    ComparisonExpr comparison_expr = 5;
    NotExpr not_expr = 6;
  }
}

message TableRef {
  string table = 1;
}

message SelectStatement {
  repeated Expression projections = 1;
  TableRef from_table = 2; 
  Expression where = 3; // Optional 
}

message Statement {
  oneof statement {
    SelectStatement select_statement = 1;
    // Add further implementation
  }
}

message ExecuteQuery {
  uint32 query_id = 1;
  Statement statement = 2;
  repeated EncryptedParameter parameters = 3;
}
