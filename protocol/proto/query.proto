syntax = "proto3";

package hegadb.protocol;

import "common.proto";
import "response.proto";

// ---------------------------------------------------------------------------
// Scalar types
// ---------------------------------------------------------------------------

// Mirrors hegadb::types::DataType.
// Used in CREATE TABLE column definitions.
enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  DATA_TYPE_INTEGER     = 1;
  DATA_TYPE_FLOAT       = 2;
  DATA_TYPE_STRING      = 3;
  DATA_TYPE_BOOLEAN     = 4;
}

// ---------------------------------------------------------------------------
// Expression primitives
// ---------------------------------------------------------------------------

message EncryptedParameter {
  uint32 index      = 1;
  bytes  ciphertext = 2;
}

message ColumnRef {
  string table  = 1;
  string column = 2;
}

message ParameterRef {
  uint32 parameter_index = 1;
}

message Wildcard {}

enum ComparisonOp {
  COMPARISON_OP_UNSPECIFIED = 0;
  COMPARISON_OP_EQ          = 1;
  COMPARISON_OP_NEQ         = 2;
  COMPARISON_OP_LT          = 3;
  COMPARISON_OP_GT          = 4;
  COMPARISON_OP_LTE         = 5;
  COMPARISON_OP_GTE         = 6;
}

enum LogicalOp {
  LOGICAL_OP_UNSPECIFIED = 0;
  LOGICAL_OP_AND         = 1;
  LOGICAL_OP_OR          = 2;
}

message ComparisonExpr {
  Expression   left     = 1;
  ComparisonOp operator = 2;  // generates operator_() accessor in C++
  Expression   right    = 3;
}

message LogicalExpr {
  Expression left     = 1;
  LogicalOp  operator = 2;  // generates operator_() accessor in C++
  Expression right    = 3;
}

message NotExpr {
  Expression child = 1;
}

message Expression {
  oneof expr_type {
    ColumnRef      column_ref      = 1;
    ParameterRef   parameter_ref   = 2;
    Wildcard       wildcard        = 3;
    LogicalExpr    logical_expr    = 4;
    ComparisonExpr comparison_expr = 5;
    NotExpr        not_expr        = 6;
  }
}

// ---------------------------------------------------------------------------
// Table references
// ---------------------------------------------------------------------------

message TableRef {
  string table = 1;
}

// ---------------------------------------------------------------------------
// JOIN clause
// ---------------------------------------------------------------------------

// Represents one INNER JOIN in a SELECT statement.
//
// The client populates right_table, left_column, and right_column for a
// simple equi-join (ON left_column = right_column).  The server's
// ExpressionPlanner reads the condition field when it is set; for equi-joins
// the planner reconstructs the condition from the column pair instead.
message JoinClause {
  TableRef   right_table  = 1;
  ColumnRef  left_column  = 2;
  ColumnRef  right_column = 3;

  // Optional explicit join-condition expression.  When present the planner
  // uses this directly; left_column / right_column are ignored.
  Expression condition    = 4;
}

// ---------------------------------------------------------------------------
// DML — SELECT
// ---------------------------------------------------------------------------

message SelectStatement {
  repeated Expression projections = 1;
  TableRef            from_table  = 2;
  Expression          where       = 3;

  // Zero or more JOIN clauses.  The planner currently processes only
  // joins(0); additional entries are reserved for future multi-join support.
  repeated JoinClause joins = 4;
}

// ---------------------------------------------------------------------------
// DDL — CREATE TABLE / DROP TABLE
// ---------------------------------------------------------------------------

// A single column definition inside a CREATE TABLE statement.
// The column's ordinal equals its position in CreateTableStatement.columns.
message ColumnDefinition {
  string   name      = 1;
  DataType data_type = 2;
  bool     nullable  = 3;
}

message CreateTableStatement {
  string                    table   = 1;
  repeated ColumnDefinition columns = 2;
}

message DropTableStatement {
  string table = 1;
}

// ---------------------------------------------------------------------------
// DML — INSERT
// ---------------------------------------------------------------------------

// NULL carries no data, so it is not encrypted.
message NullValue {}

// One cell of an INSERT row: an encrypted value, or NULL.
message InsertValue {
  oneof value {
    ParameterRef parameter_ref = 1;
    NullValue    null_value    = 2;
  }
}

message InsertRow {
  repeated InsertValue values = 1;
}

// INSERT INTO table [(columns)] VALUES rows
//
// Every non-NULL value is encrypted on the client and sent in
// ExecuteQuery.parameters; the cell holds a ParameterRef to it. Parameters
// are numbered in the order the values appear: row 0 left to right, then
// row 1, and so on.
//
// With no columns, each row has one value per table column, in column order.
message InsertStatement {
  string             table   = 1;
  repeated string    columns = 2;
  repeated InsertRow rows    = 3;
}

// ---------------------------------------------------------------------------
// Statement wrapper
// ---------------------------------------------------------------------------

message Statement {
  oneof statement {
    SelectStatement      select_statement       = 1;
    CreateTableStatement create_table_statement = 2;
    DropTableStatement   drop_table_statement   = 3;
    InsertStatement      insert_statement       = 4;
  }
}

// ---------------------------------------------------------------------------
// Keys and request envelope
// ---------------------------------------------------------------------------

message PublicKeys {
  bytes bfv_key  = 1;
  bytes ckks_key = 2;
}

// Top-level request message sent from client to server.
message ExecuteQuery {
  ProtocolVersion             protocol_version = 1;
  RequestId                   request_id       = 2;
  Statement                   statement        = 3;
  repeated EncryptedParameter parameters       = 4;
  PublicKeys                  keys             = 5;

  // Desired result mode.  When left as RESULT_MODE_UNSPECIFIED the server
  // defaults to RESULT_MODE_ROWS_AND_MASK.
  ResultMode result_mode = 6;
}
